name: Release

# release-please keeps a "chore(main): release x.y.z" pull request open, built from the
# Conventional Commits merged since the last release. Merging it tags the release (no "v"
# prefix, as Obsidian requires) and this workflow attaches the plugin files to it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Check manifest version matches the tag
        run: test "$(node -p "require('./manifest.json').version")" = "${{ needs.release-please.outputs.tag_name }}"
      - name: Attach plugin files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          dist/main.js dist/manifest.json dist/styles.css --clobber
